name: CI

# 推 master 或开 PR 时自动跑：后端核心回归 + 前端构建。
#
# 与方言平台的 CI 有一处不同：这里的 verify_core.py 用 FastAPI TestClient
# 在进程内打接口，不需要另起 uvicorn 等端口就绪，所以少一步、也快一些。
# 用的是 CI 里一次性的 postgres 库，不碰任何真实数据。

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  backend:
    name: 后端回归
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: 安装依赖
        working-directory: backend
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt

      - name: 写 CI 配置（一次性库，密钥仅测试用）
        working-directory: backend
        run: |
          cat > .env <<'EOF'
          DATABASE_URL=postgresql+psycopg://postgres:postgres@localhost:5432/postgres
          JWT_SECRET=ci-only-test-secret-0123456789abcdef
          ADMIN_INIT_PASSWORD=admin123
          CORS_ORIGINS=*
          EOF

      # ★★ 顺序不能换：先迁移，再比对 schema，最后才是回归。
      #
      #   本仓有**两条建表路径**：`create_all()`（CI 与全新环境用）和
      #   `migrate_v2.py` 的裸 DDL（线上已有库用）。CI 如果只跑 create_all，
      #   那条裸 DDL 路径的 bug **永远进不了 CI**——而它恰恰是线上唯一走的那条。
      #
      #   所以在空的 CI 库上先跑一遍 migrate_v2.py：它会把每张表都用**生产方言**
      #   的 DDL 建出来。后面两条断言都跑在这批表上，于是线上路径与 CI 路径
      #   由同一批语句产出，漂移在构造上就不存在。
      - name: 迁移（线上路径：裸 DDL 建表）
        working-directory: backend
        run: |
          set -e
          echo "===== migrate_v2（第 1 遍）====="
          .venv/bin/python scripts/migrate_v2.py || { echo "FAIL: migrate_v2"; exit 1; }
          echo "===== migrate_v2（第 2 遍，必须幂等）====="
          .venv/bin/python scripts/migrate_v2.py || { echo "FAIL: migrate_v2 不幂等"; exit 1; }

      # 逐表逐列比对「库里的实际结构」与 ORM 模型。上面那条只证明迁移能跑完，
      # 这条证明它建出来的东西是对的（少一列、类型不同、漏一条索引都在这里现形）。
      - name: schema 一致性（ORM vs 实际库）
        working-directory: backend
        run: |
          set -e
          echo "===== verify_schema ====="
          .venv/bin/python scripts/verify_schema.py || { echo "FAIL: verify_schema"; exit 1; }

      # 149 条断言，覆盖：认证审批、团队与角色、标注、质检、数据隔断、
      # 代填归属、导出、统计、停用即时失效、注册限流。
      # 脚本自己清理，最后还会断言"测试数据已清理干净（含 v2 的标注/质检/团队）"。
      - name: 核心回归（149 断言）
        working-directory: backend
        run: |
          set -e
          echo "===== verify_core ====="
          .venv/bin/python scripts/verify_core.py || { echo "FAIL: verify_core"; exit 1; }

      # 30 条断言，**不经 HTTP**，直接验 core/scope.py 的读/写谓词语义。
      # 与上面那条互不替代：verify_core 证明「接口表现对」，这条证明「隔断定义本身对」。
      # 尤其那个 leader 没挂组 → 空集 的边界，端到端会假绿（库里本来就没数据，
      # 返回空看起来和正确地锁死一模一样），只有这里把「空集」和「本该匹配上的人」
      # 放进同一个库才测得出来。
      - name: 隔断谓词单测（30 断言）
        working-directory: backend
        run: |
          set -e
          echo "===== verify_scope ====="
          .venv/bin/python scripts/verify_scope.py || { echo "FAIL: verify_scope"; exit 1; }

      # 37 条断言：只读演示账号（赛事评审用）的写拦截。
      # 这道守卫挂在 19 个写接口前，**漏挂一个 router 就是一处绕过口子**，
      # 所以它逐个 router 各打一发，而不是只测 teams 一个。
      # 同时用普通账号打同一批请求，断言「不是 403」——守卫最容易写错的方式
      # 是拦成一刀切（所有非 GET 全拦），那会把正常账号一起打死。
      - name: 只读账号拦截（37 断言）
        working-directory: backend
        run: |
          set -e
          echo "===== verify_readonly ====="
          .venv/bin/python scripts/verify_readonly.py || { echo "FAIL: verify_readonly"; exit 1; }

  frontend:
    name: 前端构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        working-directory: frontend
        run: npm ci

      - name: 构建
        working-directory: frontend
        run: npm run build
